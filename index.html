e-matrix .speaker,.schedule-matrix .org{font-size:8px}.matrix-panel{gap:4px 10px}}</style></head><body><header><a href="#" class="brand"><span class="gw-mark">GT</span><span>GWiE<small>Graduate Women in Engineering</small></span></a><nav class="topnav"><a href="#">Schedule</a><a href="#matrix">Schedule Matrix</a><a href="#speakers">Speakers</a><a href="#logistics">Logistics</a></nav></header><main class="wrap" id="app"></main><footer>Georgia Tech Graduate Women in Engineering (GT GWiE) · Career Exploration Conference · November 3, 2026 · 9 AM–5 PM</footer><script>

['lasya','Lasya Akshara','Deloitte · Consultant, Finance & Supply Chain','consulting'],
['neelima','Neelima Ramaraju','OpenHI','startup'],['anna','Anna Newgard','Alloy Therapeutics','bio'],['guyline','Guyline Malala','Peace Corps','nonprofit'],['anisha','Anisha Tripathi','GTRI','gov'],['reza','Reza Nabi','USPTO','patent'],['john','John Boezi','Boezi Product Development','product'],['kyriaki','Dr. Kyriaki Kalaitzidou','Mechanical Engineering · Professor','academic'],['tom','Tom Rosenmayer','Quadrant-i','startup'],['izza','Izza Khan','UCB','bio'],['rayyan','Rayyan Mahmood','Alliance Medical Physics','medical'],['sara','Sara Mirzaee','Moms Against Poverty','nonprofit'],['luisa','Dr. Luisa Piccolo Serafim','Aerospace · Postdoc','postdoc']].map(([id,name,org,type])=>({id,name,org,type}));

[0,'Home Park','Founding a company',['neelima']], [0,'Kirkwood','Biomedical research',['anna']], [0,'Highland','Nonprofit & service',['guyline']], [0,'Inman Park','Government & patents',['anisha','reza'],'Quadrant-i government participant pending'], [0,'Sweet Auburn','Entrepreneurship & product development',['john']], [0,'Summer Hill','Academia',[],'Department and speaker pending'],
[1,'Home Park','Startup & entrepreneurship',[],'Quadrant-i Silicon Valley speaker pending'],[1,'Kirkwood','Biomedical research',['anna']],[1,'Highland','Nonprofit & service',['guyline']],[1,'Inman Park','Government & patents',['anisha','reza'],'Quadrant-i government participant pending'],[1,'Sweet Auburn','Academia & mentoring workshop',['kyriaki']],[1,'Summer Hill','Academia',[],'Department and speaker pending'],

const questions={consulting:['What does consulting in finance and supply chain involve day to day?','How can graduate students translate technical research and problem-solving into consulting work?','What skills and experiences help candidates stand out for consulting roles?'],startup:['What led you to build or join a startup?','How do you assess whether a research idea can become a viable business?','What should graduate students understand about IP, university resources, and funding?'],bio:['How does biomedical research in your organization differ from academic research?','How does a finding move toward a therapeutic or medical application?','What experiences help graduate students enter your field?'],medical:['What does a medical physicist’s day-to-day work involve?','What additional training or credentials should students investigate?','How do you collaborate with clinical teams?'],nonprofit:['What opportunities exist for people with graduate or technical training?','How do community needs and funding shape your work?','What should students understand about entering service or nonprofit work?'],gov:['How does graduate research translate into work at your organization?','How are projects selected and teams assembled?','What should applicants know about hiring timelines and eligibility?'],patent:['What does a patent professional do in a typical day?','How does technical training translate into patent work?','What should students know about applications, eligibility, and training?'],product:['How do you move an idea from prototype to product?','How do customer needs, cost, and manufacturing affect technical decisions?','What opportunities exist for graduate-trained engineers?'],academic:['How should students decide whether academia fits their goals?','How can students choose a postdoc or mentor?','What should candidates ask about funding, teaching, and institutional support?'],postdoc:['How are you approaching the faculty application process?','What has been most demanding or surprising?','What can current graduate students start preparing now?']};

const person=id=>people.find(p=>p.id===id);const link=id=>{const p=person(id);return `<a class="speaker" href="#speaker/${id}">${p.name} ↗</a><div class="org">${p.org}</div>`};

function intro(title,desc){return `<div class="hero"><div><div class="eyebrow">Georgia Tech Graduate Women in Engineering</div><h1>${title}</h1><p>${desc}</p></div><div class="stamp"><strong>Nov 3</strong>Tuesday · 2026<br>9:00 AM – 5:00 PM</div></div>`}

function logistics(){const decks=[
['Closest option','W02 · Student Center Deck','355 Ferst Drive NW, Atlanta, GA','Paid visitor parking. Follow the entrance signs and posted payment instructions.','Exit on foot toward Exhibition Hall and the Student Center. Follow the pedestrian route to 460 Fourth Street NW; use marked crossings on Ferst Drive.','https://studentcenter.gatech.edu/parking-information'],
['Alternative deck','W23 · Area 5 / North Deck','268 Peachtree Place NW, Atlanta, GA','Paid visitor parking; Georgia Tech lists $2/hour, $15 daily maximum. Confirm the posted rate on arrival.','Head south toward Ferst Drive using campus sidewalks, then follow the walking route toward Exhibition Hall and the Student Center.','https://bioresearch.gatech.edu/about/location'],
['Alternative deck','W22 · Area 12 / Dalney Deck','926 Dalney Street NW, Atlanta, GA','Paid visitor parking. Take a ticket at entry and pay at exit; use the posted fee schedule.','Walk toward Ferst Drive, then continue through campus toward Exhibition Hall at Fourth Street. Open walking directions for the route from the deck.','https://osp.gatech.edu/visitors']
];return intro('Getting here.<br>Feeling prepared.','Arrival, parking, room locations, and day-of contacts for the GT GWiE Career Exploration Conference.')+`<div class="detail"><section><article class="card"><div class="eyebrow">Where to arrive</div><h2>Georgia Tech Exhibition Hall</h2><p><strong>460 Fourth Street NW<br>Atlanta, GA 30332</strong></p><p>Tuesday, November 3 · 9 AM–5 PM Eastern<br>Allow extra time to park and walk to the building.</p><p>Start with <strong>breakfast in Midtown II at 9:00 AM, on the first floor.</strong> Breakout sessions begin at 9:30 AM in the named rooms on the second floor. Use the building stairs or elevator to reach your room.</p><div class="tabs"><a class="button" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=Georgia+Tech+Exhibition+Hall+460+Fourth+Street+NW+Atlanta">Find Exhibition Hall ↗</a><a target="_blank" rel="noopener" href="https://studentcenter.gatech.edu/exhibition-hall-map">Official floor maps ↗</a></div><p class="note">Use the Exhibition Hall address for walking directions or drop-off. For driving to parking, use a deck address below.</p></article><h2>Paid parking</h2><p>Use designated visitor spaces. Availability is first come, first served. Posted rates and entrance restrictions take precedence; event parking validation has not been announced.</p>${decks.map(([tag,title,address,cost,walk,source])=>`<article class="card block"><div class="eyebrow">${tag}</div><h3>${title}</h3><p><strong>${address}</strong></p><p>${cost}</p><p><strong>Walk to the venue:</strong> ${walk}</p><div class="tabs"><a class="button" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(title+' '+address)}">Find parking ↗</a><a target="_blank" rel="noopener" href="${mapLink(address)}">Walking directions ↗</a></div><a class="note" target="_blank" rel="noopener" href="${source}">Georgia Tech parking details ↗</a></article>`).join('')}<h2>Free parking + MARTA</h2><p>No free on-campus visitor parking has been verified for this Tuesday event. These park-and-ride choices offer free daily parking within MARTA’s time limits; rail fares are separate.</p><div class="grid" style="grid-template-columns:1fr 1fr">${[['North Springs','Red Line'],['Doraville','Gold Line']].map(([station,line])=>`<article class="card"><div class="eyebrow">Free parking · Train fare extra</div><h3>${station} station</h3><p>Park in designated MARTA daily parking and take a southbound ${line} train to <strong>North Avenue station</strong>.</p><p>Keep your total parking stay under 14 hours. Follow station signs and MARTA parking procedures.</p><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(station+' MARTA station parking')}">Find station parking ↗</a></article>`).join('')}</div><article class="card block"><h3>From North Avenue station</h3><p>Walk west along North Avenue toward Georgia Tech, crossing the interstate on the sidewalk. Continue toward campus, then use the linked walking route to reach Exhibition Hall. Allow roughly 25–35 minutes for the walk, depending on your route and pace.</p><a class="button" target="_blank" rel="noopener" href="${mapLink('North Avenue MARTA Station, Atlanta GA')}">Station-to-venue directions ↗</a><p class="note">Walking time is an estimate. Check transit service and the route before departure.</p><a target="_blank" rel="noopener" href="https://itsmarta.com/parking-availability.aspx">MARTA parking rules & availability ↗</a></article></section><aside><article class="card contact"><div class="eyebrow">Day-of points of contact</div><h2>Need a hand?</h2><p>Call or text any of us for help finding the building or your room. If one person is busy, try another contact below.</p><div class="contact-person" style="padding:18px 0;"><h3>Fiza Shaikh</h3><a class="phone" href="tel:+17038673353">703-867-3353</a><div class="tabs"><a class="button" href="tel:+17038673353">Call Fiza</a><a class="button" href="sms:+17038673353">Text Fiza</a></div></div><div class="contact-person" style="padding:18px 0;border-top:1px solid #dfe2da;"><h3>Arta Osmani</h3><a class="phone" href="tel:+16307039890">630-703-9890</a><div class="tabs"><a class="button" href="tel:+16307039890">Call Arta</a><a class="button" href="sms:+16307039890">Text Arta</a></div></div><div class="contact-person" style="padding:18px 0;border-top:1px solid #dfe2da;"><h3>Rae Crim</h3><a class="phone" href="tel:+12196899732">219-689-9732</a><div class="tabs"><a class="button" href="tel:+12196899732">Call Rae</a><a class="button" href="sms:+12196899732">Text Rae</a></div></div></article><article class="card block"><div class="eyebrow">Find your room</div><h3>First floor</h3><p><strong>Midtown II</strong><br>Breakfast · Lunch · Panel · Networking reception</p><h3>Second floor</h3><p>Home Park room<br>Kirkwood room<br>Highlands room <span class="note">(Highland in the schedule)</span><br>Inman Park room<br>Sweet Auburn room<br>Summer Hill room</p><a href="#">View times & room assignments ↗</a></article><article class="card block"><h3>Accessible arrival</h3><p>Georgia Tech lists Area 9 as the Student Center ADA visitor parking lot. Use designated accessible spaces with the required placard or permit and follow posted payment rules.</p><a target="_blank" rel="noopener" href="https://studentcenter.gatech.edu/parking-information">ADA parking information ↗</a><p>Contact any of the organizers above for help coordinating your arrival.</p></article><article class="card block"><h3>Before you leave</h3><p>Check your speaker itinerary, choose your parking or transit route, and save the day-of contact numbers.</p><a href="#speakers">Find your speaker schedule ↗</a></article></aside></div><p class="note">Travel information checked October 26, 2026. Routes are planning guidance; use the linked maps for current navigation. <a href="https://studentcenter.gatech.edu/exhibition-hall-reservable-spaces" target="_blank" rel="noopener">Official room locations</a> · <a href="https://www.pts.gatech.edu/parking/visitor-parking/" target="_blank" rel="noopener">GT visitor parking</a></p>`}
function scheduleMatrix(){const rooms=['Midtown II','Home Park','Kirkwood','Highland','Inman Park','Sweet Auburn','Summer Hill'];const eventRow=(time,title,panel=false)=>`<tr><th scope="row">${time}</th><td colspan="7" class="event-cell"><div class="matrix-title">${title} · Room: Midtown II · All attendees</div>${panel?`<div class="matrix-panel">${people.map(p=>`<a href="#speaker/${p.id}">${p.name}</a>`).join('')}</div>`:''}</td></tr>`;const breakoutRow=i=>`<tr><th scope="row">${times[i]}<br><span class="matrix-muted">Breakout ${i+1}</span></th>${rooms.map(room=>{const session=sessions.find(s=>s.slot===i&&s.room===room);return `<td>${session?`<div class="matrix-title">${session.title}</div>${session.ids.map(link).join('')}`:'<span class="matrix-muted">—</span>'}</td>`}).join('')}</tr>`;return intro('Schedule matrix','The complete conference program at a glance. Select a speaker’s name to open their personal itinerary.')+`<div class="tabs"><a class="button" href="#">Schedule cards</a><button onclick="window.print()">Print matrix</button></div><p class="note">November 3, 2026 · All times Eastern · Swipe or scroll horizontally to see every room. A dash indicates no listed session.</p><div class="matrix-scroll" role="region" aria-label="Conference schedule matrix" tabindex="0"><table class="schedule-matrix"><caption>GT GWiE Career Exploration Conference · 9 AM–5 PM</caption><thead><tr><th scope="col">Time</th>${rooms.map((r,i)=>`<th scope="col">Room: ${r}${i===0?' · First floor':' · Second floor'}</th>`).join('')}</tr></thead><tbody>${eventRow('9:00–9:30 AM','Breakfast')}${breakoutRow(0)}${breakoutRow(1)}${eventRow('12:30–1:30 PM','Lunch')}${breakoutRow(2)}${eventRow('3:00–4:00 PM','All-speaker panel',true)}${eventRow('4:00–5:00 PM','Networking reception')}</tbody></table></div>`}
function render(){const hash=location.hash.slice(1);let html='';if(hash.startsWith('speaker/')){const p=person(hash.split('/')[1]);if(!p){location.hash='speakers';return}const own=sessions.filter(s=>s.ids.includes(p.id));html=`<a href="#speakers">← All speakers</a> · <a href="#logistics">Arrival & parking</a>${intro(p.name,p.org)}<div class="tabs"><button onclick="window.print()">Print my itinerary</button><button onclick="navigator.clipboard.writeText(location.href).then(()=>this.textContent='Link copied').catch(()=>this.textContent='Copy the URL from your address bar')">Copy profile link</button></div><div class="detail"><section><h2>Your speaking schedule</h2>${own.map(s=>`<div class="block">${sharedPersonal(times[s.slot],s.room)}${card(s)}</div>`).join('')}${panelCard()}${p.id==='lasya'?`<article class="card block"><div class="eyebrow">4:00–5:00 PM · Room: Midtown II</div><h3>Networking reception</h3><p>Lasya Akshara · Deloitte<br>Join attendees for the closing networking reception.</p></article>`:''}<h2>Shared conference events</h2>${shared('9:00–9:30 AM','Breakfast')}<br>${shared('12:30–1:30 PM','Lunch')}<br>${shared('4:00–5:00 PM','Networking reception')}</section><aside><div class="card"><div class="eyebrow">Your discussion guide</div><h2>Questions for your path</h2><ol>${questions[p.type].map(q=>`<li>${q}</li>`).join('')}</ol><p class="note">Suggested prompts for preparation. Moderators can adapt these to the conversation.</p></div><div class="card" style="margin-top:16px"><h3>Session flow</h3><p>10 min · Introductions<br>45 min · Moderated discussion<br>25 min · Student Q&A<br>10 min · Closing & conversation</p></div><details class="card" style="margin-top:16px"><summary>Eight core discussion questions</summary><ol>${common.map(q=>`<li>${q}</li>`).join('')}</ol></details></aside></div>`}
else if(hash==='matrix'){html=scheduleMatrix()}else if(hash==='logistics'){html=logistics()}else if(hash==='speakers'){html=intro('Find your name.<br>See your day.','Choose a speaker to view their personal itinerary and tailored discussion guide.')+`<div class="tabs"><a class="button" href="#">Full schedule</a></div><input id="search" aria-label="Search speakers" placeholder="Search by name or organization…"><div class="directory" id="directory">${people.map(p=>`<a class="card" data-search="${(p.name+' '+p.org).toLowerCase()}" href="#speaker/${p.id}"><div class="initial">${p.name.replace('Dr. ','').split(' ').map(n=>n[0]).slice(0,2).join('')}</div><h3>${p.name} ↗</h3><div class="org">${p.org}</div><p class="note">${sessions.filter(s=>s.ids.includes(p.id)).length+1+(p.id==='lasya'?1:0)} scheduled event(s) · View itinerary</p></a>`).join('')}</div>`}
else{html=intro('Career Exploration<br>Conference','Explore career paths with Georgia Tech Graduate Women in Engineering. Meet our speakers, browse the program, and click a name for a personalized itinerary.')+`<div class="tabs"><button class="active" data-filter="all">Full day</button>${times.map((t,i)=>`<button data-filter="${i}">${['Morning I','Morning II','Afternoon'][i]}</button>`).join('')}<a class="button" href="#speakers">Find my speaker schedule ↗</a><a class="button" href="#logistics">Arrival & parking ↗</a></div><p class="note">Tuesday, November 3, 2026 · 9:00 AM–5:00 PM · All times Eastern</p><div id="program">${shared('9:00–9:30 AM','Breakfast')}${times.map((t,i)=>`<section class="block session-block" data-slot="${i}"><div class="eyebrow">Breakout ${i+1} / ${t}</div><div class="grid">${sessions.filter(s=>s.slot===i).map(card).join('')}</div></section>${i===1?shared('12:30–1:30 PM','Lunch'):''}`).join('')}${shared('3:00–4:00 PM','Panel')}${panelCard()}<br>${shared('4:00–5:00 PM','Networking reception')}</div>`}if(hash==='speaker/lasya'){html=html.replace(/<h2>Shared conference events<\/h2>[\s\S]*?<\/section>/,'</section>').replace('<h3>Session flow</h3><p>10 min · Introductions<br>45 min · Moderated discussion<br>25 min · Student Q&A<br>10 min · Closing & conversation</p>','<h3>Your afternoon</h3><p>3:00–4:00 PM · All-attendee career panel<br>4:00–5:00 PM · Networking reception<br>Both events are in Midtown II.</p>')}document.getElementById('app').innerHTML=html;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.session-block').forEach(s=>s.hidden=b.dataset.filter!=='all'&&s.dataset.slot!==b.dataset.filter)});const search=document.getElementById('search');if(search)search.oninput=()=>document.querySelectorAll('[data-search]').forEach(c=>c.hidden=!c.dataset.search.includes(search.value.toLowerCase()));window.scrollTo(0,0)}
function sharedPersonal(t,r){return `<div class="bar"><strong>${t}</strong><span>Room: ${r}</span></div>`}addEventListener('hashchange',render);render();
</script></body></html>
